# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "WarpedPaperMod"
license = "MIT"
licenselink = "https://github.com/robotpony/hugo-WarpedPaperMod/blob/master/LICENSE"
description = "A fast, clean, responsive Hugo theme for WarpedVisions.org"
homepage = "https://github.com/robotpony/hugo-WarpedPaperMod"
tags = [
    "responsive",
    "simple",
    "clean",
    "light",
    "dark",
    "blog",
    "minimalist",
    "highlight.js",
    "search",
]
features = [
    "responsive",
    "single-column",
    "blog",
    "cover-image",
    "table-of-contents",
    "opengraph",
    "highlight.js",
    "favicon",
    "archive",
    "share-icons",
    "cover",
    "social-icons",
    "minified-assets",
    "theme-toggle",
    "menu-location-indicator",
    "scroll-to-top",
    "search",
]
min_version = "0.158.0"
version = "0.7.2"

[author]
name = "Bruce Alderson"
homepage = "https://github.com/robotpony/"

# Forked from PaperMod (itself derived from Paper by nanxiaobei)
[original]
name = "PaperMod"
author = "adityatelange"
homepage = "https://github.com/adityatelange"
repo = "https://github.com/adityatelange/hugo-PaperMod/"
